<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oppgave 2: User Data Assignment</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <!-- Hero section, main inputs/toggles -->
      <h1>🎬I has watched?</h1>
      <section id="inputSect">
        <label for="movie">
          Enter movie:
          <input type="text" name="movie" id="movie" />
        </label>
        <div class="watched_recommended">
        <label for="watched">
          Has watched?:
          <input type="checkbox" name="watched" id="watchedInput" />
        </label>
        <p>Recommend?: </p>
        <figure id="imgContain">
          <img
            src="./bilder/not_recommended.svg"
            alt="An empty star with no color"
            id="recommended"
            class="recommendImg"
          />
          </div>
        </figure>
        <button id="movieButton">Submit</button>
      </section>
      <hr />

      <!-- Filter -->
      <select name="filter" id="filter">
        <option value="none">None</option>
        <option value="recommended">Recommended</option>
        <option value="notRecommended">Not recommended</option>
        <option value="watched">Watched</option>
        <option value="notWatched">Not watched</option>
      </select>
      <section id="cardCont">
        <!-- Movies done -->
      </section>
      <p>Delete all?: </p>
      <button id="deleteAllBtn">Delete all</button>
    </main>
  </body>
</html>
