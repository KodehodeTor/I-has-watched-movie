<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oppgave 2: User Data Assignment</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <main>
      <section id="inputSect">
        <label for="movie">
          Enter movie:
          <input type="text" name="movie" id="movie" />
        </label>
        <label for="watched">
          Has watched?:
          <input type="checkbox" name="watched" id="isWatched" />
        </label>
        <figure id="imgContain">
          <img
            src="./bilder/not_watched.svg"
            alt="An eye icon thats not filled with color"
            id="notWatched"
            class="watchImg"
          />
        </figure>
        <button id="movieButton">Submit</button>
      </section>
      <hr />
      <select name="filter" id="filter">
        <option value="none">None</option>
        <option value="watched">Watched</option>
        <option value="notWatched">Not seen</option>
        <option value="rated">rated</option>
        <option value="notRated">Not rated</option>
      </select>
      <section id="cardCont"></section>
    </main>
  </body>
</html>
